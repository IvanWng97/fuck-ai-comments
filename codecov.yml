codecov:
  require_ci_to_pass: false
  strict_yaml_branch: main
  notify:
    wait_for_ci: false

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: diff, files
  behavior: default
  require_changes: true

ignore:
  - benches/**
  - tests/**
