[package]
name = "fuck-ai-comments"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Required, owner-aware comment policy for multi-language repositories"
homepage = "https://github.com/IvanWng97/fuck-ai-comments"
repository = "https://github.com/IvanWng97/fuck-ai-comments"
categories = ["command-line-utilities", "development-tools"]
keywords = ["comments", "lint", "tree-sitter", "ai", "github-actions"]
exclude = [
    ".github/**",
    "action/**",
    "action.yml",
    "about.hbs",
    "about.toml",
    "codecov.yml",
    "dist/**",
    "dist-workspace.toml",
    "eslint.config.js",
    "package-lock.json",
    "package.json",
]

[workspace]
resolver = "3"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
html-escape = "0.2.15"
icu_properties = "=2.3.0"
ignore = "0.4"
imara-diff = { version = "=0.2.0", default-features = false }
thiserror = "2.0"
toml_edit = { version = "0.25.13", default-features = false, features = ["parse"] }
toml_parser = "1.1.3"
tree-sitter = "=0.26.12"
tree-sitter-astro-next = "=0.1.1"
tree-sitter-css = "=0.25.0"
tree-sitter-html = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-kotlin-ng = "=1.1.0"
tree-sitter-objc = "=3.0.2"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-swift = "=0.7.3"
tree-sitter-typescript = "=0.23.2"

[dev-dependencies]
assert_cmd = "2.0"
divan = { package = "codspeed-divan-compat", version = "=5.0.1" }
tempfile = "3.21"

[[bench]]
name = "analysis"
harness = false

[lints.rust]
unreachable_pub = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
debug_assert_with_mut_call = "warn"
disallowed_methods = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
