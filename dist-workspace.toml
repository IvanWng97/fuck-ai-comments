[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# release.yml applies tested hardening transforms that cargo-dist cannot express.
allow-dirty = ["ci"]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
include = ["THIRD_PARTY_LICENSES"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
source-tarball = false
checksum = "sha256"
github-attestations = true
pr-run-mode = "plan"
github-build-setup = "../build-setup.yml"
post-announce-jobs = ["./update-major-tag"]
github-custom-job-permissions = { "update-major-tag" = { contents = "write" } }
