name: CodSpeed

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --version 5.0.1 --locked
      - name: Build benchmarks
        run: cargo codspeed build --locked -m simulation -m memory --bench analysis
      - name: Run benchmarks
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5
        with:
          mode: simulation,memory
          run: cargo codspeed run --bench analysis
