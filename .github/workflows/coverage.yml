name: Coverage

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Upload Rust coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.9.0 --locked
      - name: Validate Codecov configuration
        run: curl --fail-with-body --silent --show-error --proto '=https' --tlsv1.2 --data-binary @codecov.yml https://codecov.io/validate
      - name: Generate coverage
        run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          fail_ci_if_error: true
          files: lcov.info
          use_oidc: true
          version: v11.3.1
