name: Released Action E2E

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions: {}

jobs:
  action-e2e:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      E2E_ROOT: ${{ github.workspace }}/fuck-ai-comments-action-e2e
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          # GitHub has no macos-latest-intel alias; retain x86_64 release coverage.
          - macos-26-intel
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: refs/tags/${{ fromJSON(inputs.plan).announcement_tag }}
      - name: Prepare policy fixtures
        id: fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$E2E_ROOT/clean" "$E2E_ROOT/static-violation" "$E2E_ROOT/parse-error"
          printf '%s\n' 'const LIMIT: usize = 4;' > "$E2E_ROOT/clean/clean.rs"
          printf '%s\n' \
            '// First explanation.' \
            '// Second explanation.' \
            '// Third explanation.' \
            '// Fourth explanation.' \
            'const LIMIT: usize = 4;' > "$E2E_ROOT/static-violation/violation.rs"
          printf '%s\n' 'fn {' > "$E2E_ROOT/parse-error/broken.rs"

          git init --quiet "$E2E_ROOT/attestation"
          git -C "$E2E_ROOT/attestation" config user.email action-e2e@example.invalid
          git -C "$E2E_ROOT/attestation" config user.name "Action E2E"
          mkdir -p "$E2E_ROOT/attestation/src"
          printf '%s\n' \
            'fn limit() -> usize {' \
            '    // This boundary matches the external protocol.' \
            '    1' \
            '}' > "$E2E_ROOT/attestation/src/lib.rs"
          git -C "$E2E_ROOT/attestation" add src/lib.rs
          git -C "$E2E_ROOT/attestation" commit --quiet -m baseline
          base=$(git -C "$E2E_ROOT/attestation" rev-parse HEAD)
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"
          printf '%s\n' \
            'fn limit() -> usize {' \
            '    // This boundary matches the external protocol.' \
            '    2' \
            '}' > "$E2E_ROOT/attestation/src/lib.rs"
          git -C "$E2E_ROOT/attestation" add src/lib.rs
          git -C "$E2E_ROOT/attestation" commit --quiet -m changed-owner
      - name: Accept clean source
        id: clean
        uses: ./
        with:
          version: ${{ fromJSON(inputs.plan).releases[0].app_version }}
          mode: all
          profile: full
          path: ${{ env.E2E_ROOT }}/clean
      - name: Reject static violation
        id: static-violation
        continue-on-error: true
        uses: ./
        with:
          version: ${{ fromJSON(inputs.plan).releases[0].app_version }}
          mode: all
          profile: full
          path: ${{ env.E2E_ROOT }}/static-violation
      - name: Reject stale owner change
        id: stale-attestation
        continue-on-error: true
        uses: ./
        with:
          version: ${{ fromJSON(inputs.plan).releases[0].app_version }}
          mode: base
          profile: attestation
          base: ${{ steps.fixtures.outputs.base }}
          path: ${{ env.E2E_ROOT }}/attestation
      - name: Reject parse error
        id: parse-error
        continue-on-error: true
        uses: ./
        with:
          version: ${{ fromJSON(inputs.plan).releases[0].app_version }}
          mode: all
          profile: full
          path: ${{ env.E2E_ROOT }}/parse-error
      - name: Assert packaged Action outcomes
        if: ${{ always() }}
        shell: bash
        env:
          CLEAN_OUTCOME: ${{ steps.clean.outcome }}
          STATIC_VIOLATION_OUTCOME: ${{ steps.static-violation.outcome }}
          STALE_ATTESTATION_OUTCOME: ${{ steps.stale-attestation.outcome }}
          PARSE_ERROR_OUTCOME: ${{ steps.parse-error.outcome }}
        run: |
          test "$CLEAN_OUTCOME" = success
          test "$STATIC_VIOLATION_OUTCOME" = failure
          test "$STALE_ATTESTATION_OUTCOME" = failure
          test "$PARSE_ERROR_OUTCOME" = failure
