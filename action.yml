name: fuck-ai-comments
description: Fail CI when comments exceed owner-aware budgets or drift with changed code
author: IvanWng97

inputs:
  version:
    description: Exact fuck-ai-comments CLI version to install
    required: false
    default: "0.1.1"
  mode:
    description: Check mode; base is the fail-closed default
    required: false
    default: base
  profile:
    description: Analysis profile; full enforces budgets and attestations
    required: false
    default: full
  path:
    description: Repository path to check
    required: false
    default: .
  base:
    description: Base commit required when mode is base
    required: false
  head:
    description: Head commit used when mode is base; defaults to HEAD
    required: false
  config:
    description: Optional path to a comment-policy TOML file
    required: false

runs:
  using: node24
  main: dist/index.js

branding:
  icon: message-square
  color: red
